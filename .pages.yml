media:
  input: src/wp-content/uploads
  output: /wp-content/uploads

settings:
  content:
    merge: true

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - name: position
        label: Current title / position
        type: string
      - name: affiliation
        label: Institutional affiliation
        type: string
      - name: hero_intro
        label: Hero introduction
        type: text
        description: Short bio shown in the homepage hero. Link to Publications and Podcast by name — they will be linked automatically.
      - name: about_headline
        label: About section headline
        type: text
        description: Plain-text headline (accent styling is applied in the template).
      - name: about_body
        label: About section body
        type: text
      - name: podcast_summary
        label: Podcast summary (about sidebar)
        type: text
      - name: publications_teaser
        label: Publications teaser text
        type: text
      - name: podcast_teaser
        label: Podcast teaser text
        type: text
      - name: quote
        label: Quote text
        type: string
      - name: quote_author
        label: Quote attribution
        type: string
      - name: youtube_id
        label: YouTube video ID
        type: string
        description: ID only, e.g. xQm9wWMyG3M
      - name: social_handle
        label: Featured social handle
        type: string

  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: url
        label: Site URL
        type: string
      - name: email
        label: Contact email
        type: string
      - name: twitter
        label: Twitter / X URL
        type: string
      - name: twitter_handle
        label: Twitter / X handle
        type: string
      - name: headshot
        label: Profile image
        type: image
        description: Path under /wp-content/uploads/ — upload via Media or paste path after upload.
      - name: hero_bg
        label: Homepage sidebar image
        type: image
      - name: favicon
        label: Favicon
        type: image
      - name: cv_url
        label: CV URL
        type: string
      - name: ga4_id
        label: Google Analytics 4 ID
        type: string
      - name: podcast
        label: Podcast links
        type: object
        fields:
          - name: site
            label: Podcast website
            type: string
          - name: apple
            label: Apple Podcasts URL
            type: string
          - name: spotify
            label: Spotify URL
            type: string
          - name: embed
            label: Apple Podcasts embed URL
            type: string

  - name: publications
    label: Publications
    type: file
    path: src/_data/pubs.json
    format: json
    list: true
    view:
      primary: title
      sort: year
      order: desc
      fields: [year, authors, title, journal]
    fields:
      - name: year
        label: Year
        type: number
        required: true
      - name: authors
        label: Author(s)
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: journal
        label: Journal or publication venue
        type: string
      - name: volume
        label: Volume
        type: string
      - name: issue
        label: Issue
        type: string
      - name: pages
        label: Pages
        type: string
      - name: type
        label: Publication type
        type: string
      - name: doi
        label: DOI
        type: string
      - name: preprint_url
        label: Preprint URL
        type: string
      - name: published_url
        label: Published-version URL
        type: string
      - name: pdf_url
        label: PDF URL
        type: string
      - name: featured
        label: Featured
        type: boolean
      - name: order
        label: Display order
        type: number
      - name: note
        label: Optional note
        type: text

  - name: media
    label: Media appearances
    type: file
    path: src/_data/media.json
    format: json
    list: true
    view:
      primary: title
      sort: order
      order: asc
      fields: [category, date, outlet, title]
    fields:
      - name: order
        label: Display order
        type: number
        description: Sort order within the category (lower numbers appear first).
      - name: category
        label: Format or category
        type: select
        options:
          values:
            - Presentations
            - Television
            - Print
            - Radio
            - Podcasts / YouTube
            - Independent Publishers
        required: true
      - name: date
        label: Date
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: outlet
        label: Outlet
        type: string
      - name: description
        label: Description
        type: string
        description: e.g. "Student Lecture", "Public Lecture"
      - name: url
        label: URL
        type: string
      - name: image
        label: Image
        type: image
      - name: featured
        label: Featured
        type: boolean
